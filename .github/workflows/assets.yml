name: assets

on:
  push:
    branches: [main]
    paths: [_b64/manifest.json, _b64/decode.py, .github/workflows/assets.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binary assets (images, fonts, audio, video)
        run: python3 _b64/decode.py
      - name: Commit decoded assets
        run: |
          if [ ! -f _b64/.done ]; then echo "Upload incomplete, skipping"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q _b64
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Decode binary site assets" && git push; fi
      - name: Enable GitHub Pages (main branch, root) if not already enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
          else
            gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=main" -f "source[path]=/" -f build_type=legacy
          fi
